<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Model Of The Year Award</title>
    <link rel="stylesheet" href="index2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="services-container">
        <section class="services-page">
            <div class="services-card">
                <div class="video-side">
                    <div class="video-label">Our Video</div>
                    <div class="video-container">
                        <div id="videoPlaceholder" class="video-placeholder">
                            <i class="fas fa-play-circle"></i>
                            <h3>Our Services Video</h3>
                            <p>Loading video...</p>
                        </div>
                        <video id="awardVideo" controls muted playsinline>
                            <source src="videos/award-video1.mp4" type="video/mp4">
                            Your browser does not support the video element.
                        </video>
                        <div id="videoOverlay" class="video-overlay hidden">
                            <button id="videoOverlayBtn" class="overlay-btn">
                                <i class="fas fa-volume-up"></i> Play with sound
                            </button>
                        </div>
                    </div>
                </div>

                <div class="services-content-side">
                    <div class="services-header">
                        <h2 class="services-title">Give us a DM</h2>
                        <p class="services-subtitle">For any of our services</p>
                    </div>

                    <div class="dm-section">
                        <button class="dm-button" id="dmButton">
                            <i class="fab fa-instagram"></i> Send us a DM
                        </button>
                        <p class="dm-info">
                            Contact us for award events, video production, and more
                        </p>
                    </div>

                    <div class="school-section">
                        <div class="image-label">Our Work</div>
                        <div class="school-image-container" id="schoolImageContainer">
                            <div class="placeholder-text">Our Portfolio</div>
                        </div>
                        <div class="school-label">Portfolio</div>
                    </div>
                </div>
            </div>

            <div class="back-indicator">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Award Page
                </a>
            </div>
        </section>
    </div>

    <div class="notification" id="notification">
        <p>Welcome to our Services Page!</p>
    </div>

    <script src="index2.js"></script>
</body>
</html>

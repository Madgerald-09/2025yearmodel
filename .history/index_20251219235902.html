<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Of The Year Award 2025</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <section class="page-section award-page">
            <div class="award-card">
                <div class="content-side">
                    <div class="welcome-text">Welcome To</div>
                    <h1 class="award-title">
                        <span class="model-text">Model</span> Of The Year Award
                    </h1>
                    <div class="year">2025</div>
                    <div class="countdown-container">
                        <h2 class="countdown-title">Event Starts In:</h2>
                        <div class="countdown">
                            <div class="countdown-item">
                                <span id="hours24">24</span>
                                <div class="countdown-label">Hours</div>
                            </div>
                            <div class="countdown-item">
                                <span id="minutes60">00</span>
                                <div class="countdown-label">Minutes</div>
                            </div>
                            <div class="countdown-item">
                                <span id="seconds60">00</span>
                                <div class="countdown-label">Seconds</div>
                            </div>
                        </div>
                        <p class="countdown-note">Live event starts in 24 hours</p>
                    </div>
                    <div class="watch-show-container">
                        <a href="index2.html" class="watch-show-btn">
                            <i class="fas fa-play-circle"></i> Watch Show
                        </a>
                        <div class="show-info">
                            <p>Live on December 31, 2025 at 8:00 PM EST</p>
                        </div>
                    </div>
                </div>
                <div class="image-side">
                    <div class="pic-label">Main Image</div>
                    <div class="image-area"></div>
                </div>
            </div>
            <div class="scroll-indicator">
                <p>Click "Watch Show" to continue</p>
                <i class="fas fa-arrow-right"></i>
            </div>
        </section>
    </div>
    <div class="notification" id="notification">
        <p>Welcome to Model Of The Year Award 2025!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Of The Year Award 2025</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ===== BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background-color: #050505; /* Darker body background */
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* ===== HEADER BANNER (IMAGE BOX AT TOP) ===== */
        .header-banner {
            position: relative;
            width: 100%;
            height: 50vh; /* Takes up 50% of the screen height */
            min-height: 400px; /* Ensures it doesn't get too small on mobile */
            z-index: 1;
            background: #000;
            border-bottom: 2px solid #d4b996;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* The container where the JS injects the image */
        .header-bg-container {
            width: 100%;
            height: 100%;
            /* Initial fallback */
            background: linear-gradient(
                rgba(0, 0, 0, 0.3), 
                rgba(0, 0, 0, 0.6)
            ), url('https://images.unsplash.com/photo-1596703923338-48f1c07e4f2e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80');
            background-size: cover;
            background-position: center top;
            transition: background-image 0.5s ease;
        }

        /* Optional: Overlay text on the image if desired later */
        .header-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #050505, transparent);
        }

        /* ===== MAIN CONTAINER ===== */
        .main-container {
            /* Pull the container up to overlap the image box slightly */
            margin-top: -80px; 
            position: relative;
            z-index: 2;
            padding: 0 20px 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== AWARD PAGE ===== */
        .page-section {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .award-card {
            background: rgba(20, 15, 10, 0.95);
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
            max-width: 900px; /* Slightly narrower for the new layout */
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(212, 185, 150, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            text-align: center;
        }

        /* Content Side */
        .content-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: #d4b996;
            letter-spacing: 4px;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .award-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .model-text {
            color: #d4b996;
            display: inline-block;
            font-size: 4rem;
            background: linear-gradient(45deg, #d4b996, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .year {
            font-size: 5rem;
            font-weight: 900;
            color: #d4b996;
            margin: 20px 0 30px 0;
            text-align: center;
            letter-spacing: 6px;
            background: linear-gradient(45deg, #d4b996, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== COUNTDOWN STYLES ===== */
        .countdown-container {
            margin: 30px 0;
            text-align: center;
        }

        .countdown-title {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 15px;
            border-radius: 10px;
            border: 2px solid #d4b996;
            min-width: 140px;
            position: relative;
        }

        .countdown-item span {
            font-size: 4rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(212, 185, 150, 0.5);
        }

        .countdown-label {
            font-size: 1rem;
            color: #d4b996;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .countdown-note {
            color: #d4b996;
            font-size: 1rem;
            font-style: italic;
            margin-top: 10px;
        }

        /* ===== WATCH SHOW BUTTON ===== */
        .watch-show-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .watch-show-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 40px;
            background: linear-gradient(45deg, #d4b996, #ffd700);
            color: #000000;
            text-decoration: none;
            border: none;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(212, 185, 150, 0.4);
            cursor: pointer;
        }

        .watch-show-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 185, 150, 0.6);
        }

        .watch-show-btn i {
            font-size: 1.3rem;
        }

        .show-info {
            margin-top: 15px;
            color: #d4b996;
            font-size: 0.9rem;
            text-align: center;
            max-width: 400px;
        }

        /* ===== SCROLL INDICATOR ===== */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #d4b996;
            animation: bounce 2s infinite;
            z-index: 20;
            pointer-events: none;
            display: none; /* Hidden on desktop since content is visible */
        }

        .scroll-indicator p {
            margin-bottom: 5px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .scroll-indicator i {
            font-size: 1.2rem;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(0); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(5px); }
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(20, 15, 10, 0.95);
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s ease;
            z-index: 1000;
            max-width: 400px;
            border-left: 4px solid #d4b996;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .notification p {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* ===== MEDIA QUERIES ===== */

        /* Tablets */
        @media (max-width: 768px) {
            .header-banner {
                height: 40vh;
                min-height: 300px;
            }

            .main-container {
                margin-top: -50px;
                padding: 0 15px 40px 15px;
            }
            
            .award-card {
                padding: 30px 20px;
            }
            
            .award-title {
                font-size: 2.5rem;
            }
            
            .model-text {
                font-size: 3rem;
            }
            
            .year {
                font-size: 4rem;
                letter-spacing: 4px;
                margin: 15px 0 25px 0;
            }
            
            .countdown-title {
                font-size: 1.4rem;
            }
            
            .countdown {
                gap: 10px;
            }
            
            .countdown-item {
                min-width: 110px;
                padding: 15px 10px;
            }
            
            .countdown-item span {
                font-size: 3rem;
            }
            
            .countdown-label {
                font-size: 0.9rem;
            }
            
            .watch-show-btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .header-banner {
                height: 35vh;
                min-height: 250px;
            }

            .main-container {
                margin-top: -30px;
            }

            .award-card {
                padding: 25px 15px;
            }
            
            .award-title {
                font-size: 2rem;
            }
            
            .model-text {
                font-size: 2.5rem;
            }
            
            .year {
                font-size: 3.5rem;
                letter-spacing: 3px;
            }
            
            .countdown-title {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }
            
            .countdown {
                gap: 5px;
            }
            
            .countdown-item {
                min-width: 31%;
                padding: 12px 8px;
            }
            
            .countdown-item span {
                font-size: 2.5rem;
            }
            
            .countdown-label {
                font-size: 0.8rem;
            }
            
            .countdown-note {
                font-size: 0.9rem;
            }
            
            .watch-show-btn {
                padding: 12px 25px;
                font-size: 1rem;
                width: 100%;
                max-width: 300px;
            }
            
            .notification {
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    
    <!-- NEW: Top Header Box for the Image -->
    <div class="header-banner">
        <div class="header-bg-container" id="backgroundContainer">
            <!-- Background image will be set here via JS -->
        </div>
        <div class="header-overlay"></div>
    </div>

    <div class="main-container">
        <section class="page-section award-page">
            <div class="award-card">
                <div class="content-side">
                    <div class="welcome-text">Welcome To</div>
                    <h1 class="award-title">
                        <span class="model-text">Model</span> Of The Year Award
                    </h1>
                    <div class="year">2025</div>
                    
                    <div class="countdown-container">
                        <h2 class="countdown-title" id="countdownTitle">Countdown to January 4th</h2>
                        <div class="countdown">
                            <div class="countdown-item">
                                <span id="hours">48</span>
                                <div class="countdown-label">Hours</div>
                            </div>
                            <div class="countdown-item">
                                <span id="minutes">00</span>
                                <div class="countdown-label">Minutes</div>
                            </div>
                            <div class="countdown-item">
                                <span id="seconds">00</span>
                                <div class="countdown-label">Seconds</div>
                            </div>
                        </div>
                        <p class="countdown-note" id="countdownNote">48-hour countdown until January 4th announcement</p>
                    </div>
                    
                    <div class="watch-show-container">
                        <!-- Replaced href with # for demo purposes, originally index2.html -->
                        <a href="index2.html" class="watch-show-btn">
                            <i class="fas fa-play-circle"></i> Watch Show
                        </a>
                        <div class="show-info">
                            <p>Official announcement on January 4, 2025 at 00:00:00</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="scroll-indicator">
                <p>Click "Watch Show" for Services</p>
                <i class="fas fa-arrow-right"></i>
            </div>
        </section>
    </div>
    
    <div class="notification" id="notification">
        <p>Welcome to Model Of The Year Award 2025!</p>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // DOM Elements
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");
            const notification = document.getElementById("notification");
            // Now targeting the header bg container
            const backgroundContainer = document.getElementById("backgroundContainer");
            const countdownTitle = document.getElementById("countdownTitle");
            const countdownNote = document.getElementById("countdownNote");

            // Set 48-hour countdown from current time
            let totalSeconds = 48 * 60 * 60; // 48 hours in seconds

            // Countdown function
            function updateCountdown() {
                if (totalSeconds <= 0) {
                    // Countdown finished
                    hoursEl.textContent = "00";
                    minutesEl.textContent = "00";
                    secondsEl.textContent = "00";
                    countdownTitle.textContent = "🎉 January 4th Has Arrived!";
                    countdownNote.textContent = "Welcome to Model Of The Year Award 2025!";
                    
                    // Show celebration notification
                    if (!window.countdownFinished) {
                        showNotification("🎉 January 4th has arrived! Welcome to Model Of The Year Award 2025!");
                        window.countdownFinished = true;
                    }
                    return;
                }

                // Calculate hours, minutes, seconds
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                // Update display
                hoursEl.textContent = hours.toString().padStart(2, '0');
                minutesEl.textContent = minutes.toString().padStart(2, '0');
                secondsEl.textContent = seconds.toString().padStart(2, '0');

                // Update note
                if (hours > 24) {
                    countdownNote.textContent = `2 days until January 4th announcement`;
                } else if (hours > 0) {
                    countdownNote.textContent = `${hours}h ${minutes}m until January 4th announcement`;
                } else {
                    countdownNote.textContent = `${minutes}m ${seconds}s until January 4th announcement`;
                }

                totalSeconds--;
            }

            // Show notification
            function showNotification(message) {
                notification.querySelector("p").textContent = message;
                notification.classList.add("show");
                setTimeout(() => {
                    notification.classList.remove("show");
                }, 3000);
            }

            // Set background image for the header box
            function setBackgroundImage() {
                // Try multiple image sources
                const imageSources = [
                    'images/award-image1.png',
                    'images/first_pic.jpeg',
                    'images/model-award.jpg',
                    'images/award.jpg',
                    'https://images.unsplash.com/photo-1596703923338-48f1c07e4f2e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80',
                    'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
                ];
                
                let currentImage = 0;
                
                function tryNextImage() {
                    if (currentImage >= imageSources.length) {
                        // All images failed - use solid color
                        backgroundContainer.style.background = 
                            'linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8))';
                        return;
                    }
                    
                    const img = new Image();
                    img.onload = function() {
                        // Image loaded successfully
                        backgroundContainer.style.backgroundImage = 
                            `linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)), 
                             url('${imageSources[currentImage]}')`;
                        backgroundContainer.style.backgroundSize = 'cover';
                        backgroundContainer.style.backgroundPosition = 'center top'; // Focus on top
                        backgroundContainer.style.backgroundRepeat = 'no-repeat';
                        console.log('Background image loaded:', imageSources[currentImage]);
                    };
                    
                    img.onerror = function() {
                        // Try next image
                        currentImage++;
                        tryNextImage();
                    };
                    
                    img.src = imageSources[currentImage];
                }
                
                tryNextImage();
            }

            // Initialize
            function initialize() {
                // Set background image
                setBackgroundImage();
                
                // Start countdown
                updateCountdown();
                setInterval(updateCountdown, 1000);
                
                // Show welcome notification
                setTimeout(() => {
                    showNotification("48-hour countdown to January 4th has started!");
                }, 1000);
            }

            // Start everything
            initialize();
        });
    </script>
</body>
</html>
